[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "validkit"
version = "0.1.0"
description = "A small, stdlib-only library of validation and normalization helpers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0,<9.0"]

[tool.setuptools.packages.find]
include = ["validkit*"]
